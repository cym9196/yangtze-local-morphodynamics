# 中文说明：GitHub Actions 自动执行静态校验，防止参数、几何和字典彼此不一致。
name: validate-case

on:
  push:
  pull_request:

jobs:
  dictionaries-and-mesh-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate deterministic mesh dictionary
        run: |
          python3 make_variable_mesh.py
          python3 make_contact_quadrature.py
          python3 set_decomposition.py 6
      - name: Check generated file and parameter consistency
        run: |
          git diff --exit-code -- system/blockMeshDict system/decomposeParDict constant/contactQuadrature
          python3 validate_case.py
